name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22.x
  CONFIGURATION: Release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration "${{ env.CONFIGURATION }}" --no-restore

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Upload documentation artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: documentation-site
          path: docs/.vitepress/dist
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration "${{ env.CONFIGURATION }}" --no-restore

  format:
    name: Format
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore
        run: dotnet restore

      - name: Install formatting tools
        run: npm ci

      - name: Verify formatting
        continue-on-error: true
        run: npm run format:check

      - name: Check code style
        continue-on-error: true
        run: npm run style:check

      - name: Check analyzers
        continue-on-error: true
        run: npm run analyzers:check

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs:
      - test
      - format

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Pack NuGet packages
        run: dotnet pack --configuration "${{ env.CONFIGURATION }}" --no-restore --output ./artifacts/packages

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4.1.9
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    needs:
      - docs
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    concurrency:
      group: deploy-docs
      cancel-in-progress: false

    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4.1.9
        with:
          name: documentation-site
          path: ./site

      - name: Create deployment token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.DOCS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_APP_PRIVATE_KEY }}
          owner: heuristiclib
          repositories: heuristiclib.github.io

      - name: Publish to heuristiclib.github.io
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          personal_token: ${{ steps.app-token.outputs.token }}
          external_repository: heuristiclib/heuristiclib.github.io
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          commit_message: Deploy documentation from ${{ github.repository }}@${{ github.sha }}
